name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build/

      - name: Decode PEM key
        run: |
          echo "$AZURE_PRIVATE_KEY_B64" | base64 --decode > key.pem
          chmod 600 key.pem
        env:
          AZURE_PRIVATE_KEY_B64: ${{ secrets.AZURE_PRIVATE_KEY_B64 }}

      - name: Deploy to VM
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no azureuser@${{ secrets.VM_PUBLIC_IP }} "sudo rm -rf /var/www/html/*"
          scp -i key.pem -o StrictHostKeyChecking=no -r build/* azureuser@${{ secrets.VM_PUBLIC_IP }}:/var/www/html/
          ssh -i key.pem -o StrictHostKeyChecking=no azureuser@${{ secrets.VM_PUBLIC_IP }} "sudo systemctl restart apache2"