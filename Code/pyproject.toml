[tool.poetry]
name = "dev"
version = "0.1.0"
description = "Cupid Code python/backend dependencies management."
authors = ["Emma <a02324881@usu.edu>", "Tyson <tyson.buxton@usu.edu>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14.0"

# django framework
django = "^5.2.7"
djangorestframework = "^3.16.1"
django-debug-toolbar = "^6.0.0"

# Tool for HTTP requests
requests = "^2.32.5"

# Tool for loading env file variables
python-dotenv = "^1.1.1"


# Image processing tool
pillow = "^12.0.0"

# Location
geopy = "^2.4.1"
geoip2 = "^5.1.0"

# Yelp
yelpapi = "^2.5.1"

# Text to Speech
speechrecognition = "^3.14.3"

# AI tools
transformers = "^4.57.1"

# Phone calls/text management 
twilio = "^9.8.4"
sendgrid = "^6.12.5"

# Code testing
selenium = "^4.37.0"

# Payment processing
stripe = "^13.0.1"
openai = "^2.6.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
